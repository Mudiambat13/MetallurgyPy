name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the run still in progress.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core (Python ${{ matrix.python }}, no GUI)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the Core and the test tools only (no Qt)
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: The Core must not need Qt, matplotlib or openpyxl
        run: |
          python - <<'PY'
          import importlib.util as u
          for name in ("PySide6", "matplotlib", "openpyxl"):
              assert u.find_spec(name) is None, f"{name} should not be installed in this job"
          import metallurgypy
          from metallurgypy.registry import list_models
          print(metallurgypy.__version__, len(list_models()), "models")
          PY
      - name: Tests (optional-dependency tests skip themselves)
        run: pytest -q --ignore=tests/gui

  optional-extras:
    name: Core with the optional extras (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[visualization,excel]" pytest
      - name: Tests including charts, PDF reports and .xlsx import
        run: pytest -q --ignore=tests/gui

  quality:
    name: Lint, format, types, generated docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: ruff (lint)
        run: ruff check .
      - name: ruff (format)
        run: ruff format --check .
      - name: mypy (strict)
        run: mypy
      - name: Generated documentation pages are up to date
        run: |
          python tools/gen_model_reference.py --check
          python tools/gen_api_reference.py --check

  gui:
    name: GUI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libxkbcommon0 libdbus-1-3 libfontconfig1
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui]" pytest
      - name: Studio starts
        run: metallurgypy-studio --check
      - name: GUI and Studio logic tests
        run: pytest -q tests/gui tests/studio
      - name: Take pictures of Studio (does not fail the build)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: python tools/take_studio_screenshots.py studio-screenshots
      - name: Upload the pictures of Studio
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: studio-screenshots
          path: studio-screenshots
          if-no-files-found: ignore

  packaging:
    name: Build and install the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - name: The wheel installs on its own and works without extras
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/pip install dist/*.whl
          cd /tmp
          /tmp/wheel-check/bin/python -c "import metallurgypy; from metallurgypy.registry import list_models; print(metallurgypy.__version__, len(list_models()), 'models')"
          /tmp/wheel-check/bin/python -m metallurgypy_studio --version
