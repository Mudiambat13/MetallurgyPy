site_name: MetallurgyPy
site_description: "Engineering Metallurgy with Python: scientific library and desktop studio for metallurgical calculations."
site_url: https://mudiambat13.github.io/MetallurgyPy/
repo_url: https://github.com/Mudiambat13/MetallurgyPy
repo_name: Mudiambat13/MetallurgyPy
copyright: Copyright &copy; MetallurgyPy contributors, MIT License

exclude_docs: |
  requirements.txt

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow

nav:
  - Home: index.md
  - Getting started:
      - Installation: installation.md
      - Quick start: getting_started.md
      - Tutorials:
          - tutorials/index.md
          - Your first mass balance: tutorials/first_mass_balance.md
          - Uncertainty propagation: tutorials/uncertainty.md
  - Concepts:
      - Architecture: architecture.md
      - Numerical precision and uncertainty: scientific_methods/precision.md
      - Roadmap: roadmap.md
  - Scientific methods:
      - scientific_methods/index.md
      - Mass balance: scientific_methods/mass_balance.md
      - Reagents: scientific_methods/reagents.md
      - Electrowinning: scientific_methods/electrowinning.md
      - Flotation: scientific_methods/flotation.md
      - Filtration: scientific_methods/filtration.md
      - Hydrometallurgy: scientific_methods/hydrometallurgy.md
      - Solvent extraction: scientific_methods/solvent_extraction.md
      - Thermodynamics: scientific_methods/thermodynamics.md
      - Statistics: scientific_methods/statistics.md
  - Studio (GUI):
      - gui/index.md
      - Data, projects, comparison, reports: guides/workflows.md
  - API reference:
      - api/index.md
      - "Core (units, results, errors)": api/core.md
      - Model registry: api/registry.md
      - Mass balance: api/mass_balance.md
      - Reagents: api/reagents.md
      - Electrowinning: api/electrowinning.md
      - Flotation: api/flotation.md
      - Filtration: api/filtration.md
      - Hydrometallurgy: api/hydrometallurgy.md
      - Solvent extraction: api/solvent_extraction.md
      - Thermodynamics: api/thermodynamics.md
      - Statistics: api/statistics.md
      - Precision and uncertainty: api/precision.md
      - Records and export: api/records.md
      - Data import: api/data_io.md
      - Scenario comparison: api/comparison.md
      - Reports: api/reports.md
      - Projects: api/projects.md
      - Visualization: api/visualization.md
  - Project:
      - Scientific audit: project/scientific_audit.md
      - Security: project/security.md
      - Deploying the docs: project/deploy_docs.md
      - Contributing: contributing.md
      - FAQ: faq.md
  - Français:
      - Accueil: fr/index.md
      - Installation: fr/installation.md
      - Démarrage rapide: fr/demarrage.md
      - Concepts: fr/concepts.md
      - Précision et incertitude: fr/precision.md
      - Méthodes scientifiques: fr/modules.md
      - Studio: fr/studio.md
      - Données, comparaison, rapports, projets: fr/flux.md
      - Audit scientifique et sécurité: fr/audit.md
      - FAQ: fr/faq.md
      - Contribuer: fr/contribuer.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
