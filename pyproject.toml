[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metallurgypy"
dynamic = ["version"]
description = "Engineering Metallurgy with Python: scientific library and desktop studio for metallurgical calculations."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "MetallurgyPy contributors" }]
keywords = ["metallurgy", "hydrometallurgy", "mass balance", "process engineering"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
# The Core currently needs nothing beyond the standard library.
# NumPy/SciPy/Pint are added when a module actually requires them.
dependencies = []

[project.optional-dependencies]
visualization = ["matplotlib>=3.7"]
# Kept for the name in the specification. Uncertainty propagation is implemented in the
# standard library, so this extra installs nothing extra.
uncertainty = []
# Reading .xlsx files in metallurgypy.data_io (CSV and JSON need nothing).
excel = ["openpyxl>=3.1"]
gui = ["PySide6>=6.5", "pyqtgraph>=0.13", "matplotlib>=3.7"]
dev = ["pytest>=8", "mypy>=1.8", "ruff>=0.4", "matplotlib>=3.7", "openpyxl>=3.1", "build", "twine"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5"]
all = ["metallurgypy[gui,visualization,excel,uncertainty]"]

[project.scripts]
metallurgypy-studio = "metallurgypy_studio.main:main"

[project.urls]
Documentation = "https://mudiambat13.github.io/MetallurgyPy/"
Repository = "https://github.com/Mudiambat13/MetallurgyPy"

[tool.setuptools.dynamic]
version = { attr = "metallurgypy.version.__version__" }

[tool.setuptools.packages.find]
where = ["src", "studio"]

[tool.setuptools.package-data]
metallurgypy = ["py.typed"]
metallurgypy_studio = ["resources/styles/*.qss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "studio"]
addopts = "-ra"
markers = ["gui: tests that need PySide6 and a (virtual) display"]

[tool.mypy]
strict = true
files = ["src/metallurgypy", "studio/metallurgypy_studio"]
mypy_path = ["src", "studio"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["PySide6.*", "pyqtgraph.*", "matplotlib.*", "openpyxl.*"]
ignore_missing_imports = true

# Qt base classes and slot decorators are typed by PySide6 itself; when it is not
# installed they resolve to Any, so these two checks are relaxed for Studio only.
[[tool.mypy.overrides]]
module = ["metallurgypy_studio.*"]
disallow_subclassing_any = false
disallow_untyped_decorators = false

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "studio", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# Line layout is owned by `ruff format`; long prose strings (equations, messages) are fine.
ignore = ["E501"]
